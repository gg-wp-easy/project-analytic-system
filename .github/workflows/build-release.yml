name: Build and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release from this run"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Release tag for manual publishing, for example v1.0.0"
        required: false
        type: string

permissions:
  contents: write

jobs:
  fork-pr-note:
    name: Fork PR backend access note
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Explain skipped private backend build
        run: |
          echo "This pull_request comes from a fork."
          echo "GitHub Actions does not expose repository secrets to fork PR workflows."
          echo "The private backend repository cannot be checked out in this run, so the Windows release build is skipped."

  build-windows:
    name: Build Windows updater artifacts
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
      SERVER_ANALYTIC_REPOSITORY_TOKEN: ${{ secrets.SERVER_ANALYTIC_REPOSITORY_TOKEN }}
      SERVER_ANALYTIC_PYTHON: python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Checkout backend repository with default token
        id: checkout_backend_default
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: gg-wp-easy/server-analytic-system
          path: server-analytic-system
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Remove failed backend checkout
        if: steps.checkout_backend_default.outcome == 'failure'
        shell: pwsh
        run: |
          if (Test-Path "server-analytic-system") {
            Remove-Item -Path "server-analytic-system" -Recurse -Force
          }

      - name: Checkout backend repository with backup token
        id: checkout_backend_backup
        if: steps.checkout_backend_default.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: gg-wp-easy/server-analytic-system
          path: server-analytic-system
          token: ${{ secrets.SERVER_ANALYTIC_REPOSITORY_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Diagnose backend checkout auth
        if: steps.checkout_backend_default.outcome == 'failure'
        shell: bash
        run: |
          if [ -n "${SERVER_ANALYTIC_REPOSITORY_TOKEN}" ]; then
            echo "SERVER_ANALYTIC_REPOSITORY_TOKEN is available in this workflow run."
          else
            echo "SERVER_ANALYTIC_REPOSITORY_TOKEN is NOT available in this workflow run."
          fi

          echo "Default checkout outcome: ${{ steps.checkout_backend_default.outcome }}"
          echo "Backup checkout outcome: ${{ steps.checkout_backend_backup.outcome }}"

      - name: Fail if backend checkout is unavailable
        if: steps.checkout_backend_default.outcome == 'failure' && steps.checkout_backend_backup.outcome == 'failure'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Backend repository checkout failed because this is a pull_request from a fork."
            echo "GitHub does not expose repository secrets to fork PR workflows, so SERVER_ANALYTIC_REPOSITORY_TOKEN is unavailable in this run."
            echo "Use a push branch in the main repository, workflow_dispatch, or a different CI strategy for fork PRs."
            exit 1
          fi

          if [ -n "${SERVER_ANALYTIC_REPOSITORY_TOKEN}" ]; then
            echo "Backend repository checkout failed with both GITHUB_TOKEN and SERVER_ANALYTIC_REPOSITORY_TOKEN."
            echo "The backup token is present in this run, so the most likely causes are:"
            echo "1. the token does not have read access to gg-wp-easy/server-analytic-system"
            echo "2. a fine-grained token was created for the wrong repository set"
            echo "3. the token requires org SSO authorization and is not authorized"
          else
            echo "Backend repository checkout failed and SERVER_ANALYTIC_REPOSITORY_TOKEN is not available in this run."
            echo "Check that SERVER_ANALYTIC_REPOSITORY_TOKEN is configured in this repository under Settings -> Secrets and variables -> Actions."
          fi
          exit 1

      - name: Build Electron app
        run: npm run electron:build:win -- --version-mode=package --output-dir=release\windows

      - name: Create downloadable archive
        id: package
        shell: pwsh
        run: |
          $rawName = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "run-${{ github.run_number }}" }
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.release_tag }}" -ne "") {
            $rawName = "${{ inputs.release_tag }}"
          }

          $safeName = $rawName -replace '[^A-Za-z0-9_.-]', '-'
          $zipName = "NK-Invest-Analytics-Windows-$safeName.zip"
          $stagingDir = "release-artifacts"

          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          Copy-Item -Path "release\windows\*" -Destination $stagingDir -Recurse -Force
          Compress-Archive -Path "$stagingDir\*" -DestinationPath $zipName -Force

          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "zip_path=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload downloadable archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Upload updater artifact set
        uses: actions/upload-artifact@v4
        with:
          name: nk-invest-analytics-windows-updater-files
          path: |
            release/windows/*.exe
            release/windows/*.blockmap
            release/windows/latest*.yml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag == ''
        run: |
          echo "release_tag is required when publish_release is enabled."
          exit 1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          files: |
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.blockmap
            release-assets/**/latest*.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
