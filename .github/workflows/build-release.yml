name: Build and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release from this run"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Release tag for manual publishing, for example v1.0.0"
        required: false
        type: string

permissions:
  contents: write

jobs:
  fork-pr-note:
    name: Fork PR backend access note
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Explain skipped private backend build
        run: |
          echo "This pull_request comes from a fork."
          echo "GitHub Actions does not expose repository secrets to fork PR workflows."
          echo "The private backend repository cannot be checked out in this run, so release builds are skipped."

  build-windows:
    name: Build Windows updater artifacts
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
      SERVER_ANALYTIC_REPOSITORY_TOKEN: ${{ secrets.SERVER_ANALYTIC_REPOSITORY_TOKEN }}
      SERVER_ANALYTIC_PYTHON: python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Validate backend repository token
        shell: bash
        run: |
          if [ -z "${SERVER_ANALYTIC_REPOSITORY_TOKEN}" ]; then
            echo "SERVER_ANALYTIC_REPOSITORY_TOKEN is NOT available in this workflow run."
            echo "Check that SERVER_ANALYTIC_REPOSITORY_TOKEN is configured in this repository under Settings -> Secrets and variables -> Actions."
            echo "For private gg-wp-easy/server-analytic-system access, the token must have Contents: Read-only on that repository."
            exit 1
          fi

      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          repository: gg-wp-easy/server-analytic-system
          path: server-analytic-system
          token: ${{ env.SERVER_ANALYTIC_REPOSITORY_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Build Electron app
        run: npm run electron:build:win -- --version-mode=package --output-dir=release\windows

      - name: Create downloadable archive
        id: package
        shell: pwsh
        run: |
          $rawName = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "run-${{ github.run_number }}" }
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.release_tag }}" -ne "") {
            $rawName = "${{ inputs.release_tag }}"
          }

          $safeName = $rawName -replace '[^A-Za-z0-9_.-]', '-'
          $zipName = "NK-Tech-Investment-Analytics-Windows-$safeName.zip"
          $stagingDir = "release-artifacts"

          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          Copy-Item -Path "release\windows\*" -Destination $stagingDir -Recurse -Force
          Compress-Archive -Path "$stagingDir\*" -DestinationPath $zipName -Force

          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "zip_path=$zipName" >> $env:GITHUB_OUTPUT

      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag == ''
        run: |
          echo "release_tag is required when publish_release is enabled."
          exit 1

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          files: |
            ${{ steps.package.outputs.zip_path }}
            release/windows/*.exe
            release/windows/*.blockmap
            release/windows/latest*.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux release artifacts
    runs-on: ubuntu-latest
    needs: build-windows
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
      SERVER_ANALYTIC_REPOSITORY_TOKEN: ${{ secrets.SERVER_ANALYTIC_REPOSITORY_TOKEN }}
      SERVER_ANALYTIC_PYTHON: python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Validate backend repository token
        run: |
          if [ -z "${SERVER_ANALYTIC_REPOSITORY_TOKEN}" ]; then
            echo "SERVER_ANALYTIC_REPOSITORY_TOKEN is NOT available in this workflow run."
            echo "Check that SERVER_ANALYTIC_REPOSITORY_TOKEN is configured in this repository under Settings -> Secrets and variables -> Actions."
            echo "For private gg-wp-easy/server-analytic-system access, the token must have Contents: Read-only on that repository."
            exit 1
          fi

      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          repository: gg-wp-easy/server-analytic-system
          path: server-analytic-system
          token: ${{ env.SERVER_ANALYTIC_REPOSITORY_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Build Electron app
        run: npm run electron:build:linux -- --version-mode=package --output-dir=release/linux --arch=x64

      - name: Create downloadable archive
        id: package
        run: |
          raw_name="${GITHUB_REF_NAME}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            raw_name="run-${GITHUB_RUN_NUMBER}"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            raw_name="${{ inputs.release_tag }}"
          fi

          safe_name="$(printf '%s' "$raw_name" | tr -c 'A-Za-z0-9_.-' '-')"
          archive_name="NK-Tech-Investment-Analytics-Linux-${safe_name}.tar.gz"

          tar -czf "$archive_name" -C release/linux .

          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "archive_path=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag == ''
        run: |
          echo "release_tag is required when publish_release is enabled."
          exit 1

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          files: |
            ${{ steps.package.outputs.archive_path }}
            release/linux/*.AppImage
            release/linux/*.deb
            release/linux/*.blockmap
            release/linux/latest*.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
