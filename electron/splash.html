<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NK-Tech Инвестиционная аналитика</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #c8102e;
        --brand-dark: #5a0a14;
        --bg: #ffffff;
        --bg-accent: #fdf1f3;
        --border: #e2e8f0;
        --text: #1e293b;
        --text-muted: #64748b;
        --text-faint: #94a3b8;
        --bar-track: #f1e4e6;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --brand: #f0596f;
        --brand-dark: #e5edf5;
        --bg: #0f172a;
        --bg-accent: #1f1830;
        --border: #202a3a;
        --text: #e5edf5;
        --text-muted: #94a3b8;
        --text-faint: #64748b;
        --bar-track: #202a3a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, sans-serif;
        border: 1px solid var(--border);
      }
      .card {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 0 36px;
        background: linear-gradient(135deg, var(--bg) 0%, var(--bg) 60%, var(--bg-accent) 100%);
      }
      .logo {
        width: 170px;
        height: 170px;
        flex-shrink: 0;
        object-fit: contain;
      }
      /* The logo has an opaque white background, so present it as a tile on dark. */
      :root[data-theme="dark"] .logo {
        border-radius: 24px;
      }
      .content {
        flex: 1;
        min-width: 0;
      }
      .brand {
        margin: 0 0 4px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--brand);
      }
      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
        font-weight: 700;
        color: var(--brand-dark);
      }
      p {
        margin: 10px 0 0;
        color: var(--text-muted);
        font-size: 13px;
      }
      .meta {
        margin-top: 6px;
        color: var(--text-faint);
        font-size: 12px;
      }
      .bar {
        margin-top: 22px;
        width: 100%;
        height: 6px;
        border-radius: 999px;
        overflow: hidden;
        background: var(--bar-track);
      }
      .bar-fill {
        width: 36%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--brand-dark) 0%, var(--brand) 100%);
        animation: loading 1.2s ease-in-out infinite;
      }
      @keyframes loading {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @keyframes pop-in {
        from {
          opacity: 0;
          transform: scale(0.88);
        }
      }
      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      .logo {
        animation: pop-in 700ms cubic-bezier(0.16, 1, 0.3, 1) backwards;
      }
      .content > * {
        animation: rise-in 600ms cubic-bezier(0.16, 1, 0.3, 1) backwards;
      }
      .content > :nth-child(2) {
        animation-delay: 90ms;
      }
      .content > :nth-child(3) {
        animation-delay: 180ms;
      }
      .content > :nth-child(4) {
        animation-delay: 240ms;
      }
      .content > :nth-child(5) {
        animation-delay: 300ms;
      }
      @media (prefers-reduced-motion: reduce) {
        .logo,
        .content > * {
          animation: none;
        }
      }
    </style>
    <script>
      // Set before first paint so the splash never flashes the wrong theme.
      const theme = new URLSearchParams(window.location.search).get("theme");
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    </script>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="logo_company.png" alt="NK-Tech" />
      <div class="content">
        <div class="brand">NK-Tech</div>
        <h1>Инвестиционная аналитика</h1>
        <p>Запуск аналитического ядра и подключение сервисов...</p>
        <div class="meta">Версия <span id="app-version">1.0.0</span></div>
        <div class="bar">
          <div class="bar-fill"></div>
        </div>
      </div>
    </main>
    <script>
      const version = new URLSearchParams(window.location.search).get("version");
      const versionNode = document.getElementById("app-version");

      if (version && versionNode) {
        versionNode.textContent = version;
      }
    </script>
  </body>
</html>
