<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Загрузка приложения инвестиционной аналитики</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 120% at 0% 0%, #0f172a 0%, #111827 45%, #020617 100%);
        color: #e2e8f0;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      .card {
        width: 86%;
        padding: 28px;
        border-radius: 18px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.68);
        box-shadow: 0 20px 45px rgba(2, 6, 23, 0.45);
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #38bdf8;
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.8);
        animation: pulse 1.6s infinite;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0;
        color: #94a3b8;
        font-size: 13px;
      }
      .meta {
        margin-top: 12px;
        color: #64748b;
        font-size: 12px;
        letter-spacing: 0.18px;
      }
      .bar {
        margin-top: 20px;
        width: 100%;
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(100, 116, 139, 0.28);
      }
      .bar-fill {
        width: 36%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #06b6d4 0%, #3b82f6 100%);
        animation: loading 1.2s ease-in-out infinite;
      }
      @keyframes loading {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.75);
        }
        70% {
          box-shadow: 0 0 0 10px rgba(56, 189, 248, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(56, 189, 248, 0);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="header">
        <span class="dot"></span>
        <h1>Инвестиционная аналитика</h1>
      </div>
      <p>Запуск аналитического ядра и подключение сервисов...</p>
      <div class="meta">Версия <span id="app-version">1.0.0</span></div>
      <div class="bar">
        <div class="bar-fill"></div>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const version = params.get("version");
      const versionNode = document.getElementById("app-version");

      if (version && versionNode) {
        versionNode.textContent = version;
      }
    </script>
  </body>
</html>
