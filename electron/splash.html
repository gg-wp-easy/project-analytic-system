<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NK-Tech Инвестиционная аналитика</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #c8102e;
        --brand-dark: #5a0a14;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #ffffff;
        color: #1e293b;
        font-family: "Segoe UI", Tahoma, sans-serif;
        border: 1px solid #e2e8f0;
      }
      .card {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 0 36px;
        background: linear-gradient(135deg, #ffffff 0%, #ffffff 60%, #fdf1f3 100%);
      }
      .logo {
        width: 170px;
        height: 170px;
        flex-shrink: 0;
        object-fit: contain;
      }
      .content {
        flex: 1;
        min-width: 0;
      }
      .brand {
        margin: 0 0 4px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--brand);
      }
      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
        font-weight: 700;
        color: var(--brand-dark);
      }
      p {
        margin: 10px 0 0;
        color: #64748b;
        font-size: 13px;
      }
      .meta {
        margin-top: 6px;
        color: #94a3b8;
        font-size: 12px;
      }
      .bar {
        margin-top: 22px;
        width: 100%;
        height: 6px;
        border-radius: 999px;
        overflow: hidden;
        background: #f1e4e6;
      }
      .bar-fill {
        width: 36%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--brand-dark) 0%, var(--brand) 100%);
        animation: loading 1.2s ease-in-out infinite;
      }
      @keyframes loading {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="logo_company.png" alt="NK-Tech" />
      <div class="content">
        <div class="brand">NK-Tech</div>
        <h1>Инвестиционная аналитика</h1>
        <p>Запуск аналитического ядра и подключение сервисов...</p>
        <div class="meta">Версия <span id="app-version">1.0.0</span></div>
        <div class="bar">
          <div class="bar-fill"></div>
        </div>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const version = params.get("version");
      const versionNode = document.getElementById("app-version");

      if (version && versionNode) {
        versionNode.textContent = version;
      }
    </script>
  </body>
</html>
